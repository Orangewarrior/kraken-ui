<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>KrakenWAF - Add Operator</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body class="auth-page admin-form-page">
  <main class="auth-shell form-only-shell">
    <section class="auth-card form-card">
      <a class="brand auth-brand" href="/kraken_ui/auth/acl"><span class="brand-text">Kraken<span>Waf</span></span></a>
      <div class="auth-heading"><span class="badge">ACL CRUD</span><h1>Add operator</h1></div>
      <form class="login-form management-form" method="post" action="/kraken_ui/auth/acl/operators/add" autocomplete="off" data-password-policy>
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="field-group"><label for="username">Username</label><input id="username" name="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_.-]{3,32}"></div>
        <div class="field-group"><label for="email">E-mail</label><input id="email" name="email" type="email" required maxlength="128"></div>
        <div class="field-group"><label for="user_type">Type</label><select id="user_type" name="user_type">{% for role in roles %}<option value="{{ role.value }}">{{ role.label }}</option>{% endfor %}</select></div>
        <div class="field-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required minlength="14" maxlength="256" data-strong-password>
          <span data-password-strength>Strength: waiting</span>
          <ul class="password-rules" data-password-rules><li data-rule="length">At least 14 characters</li><li data-rule="lower">Lowercase</li><li data-rule="upper">Uppercase</li><li data-rule="digit">Number</li><li data-rule="symbol">Symbol</li><li data-rule="identity">No identity data</li></ul>
        </div>
        <button class="cta submit-button" type="submit" data-policy-submit disabled>Create</button>
      </form>
    </section>
  </main>
</body>
</html>
