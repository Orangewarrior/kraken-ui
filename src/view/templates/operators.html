<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>KrakenWAF - Operators</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <main class="page table-page">
    <section class="page-hero compact-hero">
      <span class="badge">ACL Operators</span>
      <h1>Operator database</h1>
      <p class="lead">Passwords and encrypted password records are never returned by this endpoint.</p>
      <div class="cta-row">
        <a class="ghost-button" href="/kraken_ui/auth/acl">ACL</a>
        <a class="cta" href="/kraken_ui/auth/acl/operators/add">Add operator</a>
      </div>
    </section>
    <section class="table-card">
      <div class="table-toolbar">
        <h2>Operators</h2>
        <label class="table-search"><span>Search</span><input type="search" data-kw-table-search="operators-table" autocomplete="off"></label>
      </div>
      <div class="table-scroll">
        <table id="operators-table" class="kw-table" data-kw-table data-table-kind="users" data-ajax-url="/kraken_ui/auth/api/operators" data-server-side="true" data-page-size="8">
          <thead><tr><th>ID</th><th>Username</th><th>E-mail</th><th>Type</th><th>Status</th><th>Created</th><th>Edit</th><th>Delete</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="table-footer">
        <button type="button" class="ghost-button" data-kw-table-prev="operators-table">Previous</button>
        <span data-kw-table-info="operators-table">Loading...</span>
        <button type="button" class="ghost-button" data-kw-table-next="operators-table">Next</button>
      </div>
    </section>
    <form method="post" action="/kraken_ui/auth/logout">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button class="ghost-button" type="submit">Logout</button>
    </form>
  </main>
</body>
</html>
