<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>KrakenWAF - Delete Operator</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-page admin-form-page">
  <main class="auth-shell form-only-shell">
    <section class="auth-card form-card">
      <a class="brand auth-brand" href="/kraken_ui/auth/acl/operators"><span class="brand-text">Kraken<span>Waf</span></span></a>
      <div class="auth-heading"><span class="badge danger-badge">Destructive action</span><h1>Delete operator</h1></div>
      <form class="login-form management-form" method="post" action="/kraken_ui/auth/acl/operators/delete">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="field-group"><label for="user_id">User ID</label><input id="user_id" name="user_id" type="number" min="1" value="{{ id_user }}"></div>
        <div class="form-separator"><span>or</span></div>
        <div class="field-group"><label for="email">E-mail</label><input id="email" name="email" type="email" maxlength="128" value="{{ email }}"></div>
        <button class="cta submit-button danger-button" type="submit">Delete</button>
      </form>
    </section>
  </main>
</body>
</html>
