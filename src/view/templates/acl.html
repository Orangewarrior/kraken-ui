<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>KrakenWAF - ACL</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body class="auth-page admin-form-page">
  <main class="auth-shell form-only-shell">
    <section class="auth-card form-card">
      <a class="brand auth-brand" href="/kraken_ui/auth/painel_admin">
        <img class="brand-mark-img" src="/static/img/logo-mark.png" width="40" height="40" alt="">
        <span class="brand-text">Kraken<span>Waf</span></span>
      </a>
      <div class="auth-heading">
        <span class="badge">Admin ACL Console</span>
        <h1>Operator administration</h1>
        <p class="lead">Create, inspect, update, and delete admin, operator, and auditor identities.</p>
      </div>
      <section class="acl-grid">
        <a class="action-card" href="/kraken_ui/auth/acl/operators/add"><h2>Add operator</h2><p>Create a protected console identity.</p></a>
        <a class="action-card" href="/kraken_ui/auth/acl/operators"><h2>List operators</h2><p>Search and manage existing identities.</p></a>
        <a class="action-card" href="/kraken_ui/auth/acl/operators/delete"><h2>Delete operator</h2><p>Delete by numeric ID or unique e-mail.</p></a>
      </section>
      <form method="post" action="/kraken_ui/auth/logout">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="ghost-button" type="submit">Logout</button>
      </form>
    </section>
  </main>
</body>
</html>
