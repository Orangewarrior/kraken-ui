[advisories]
version = 2
yanked = "deny"
ignore = [
    # proc-macro-error2 is flagged unmaintained (RUSTSEC-2026-0173). It is pulled
    # in only transitively through sea-orm -> sea-orm-macros -> sea-bae as a
    # build-time proc-macro (no runtime or network exposure), and upstream offers
    # no safe upgrade yet. Drop this once SeaORM stops depending on it.
    "RUSTSEC-2026-0173",
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Required transitively by the mandated Axum/Rustls, SeaORM and Ammonia stack.
    "Apache-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
